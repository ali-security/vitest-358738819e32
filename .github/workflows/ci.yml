name: CI

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional test filter appended to the test commands
        required: false
        default: ''
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  VITEST_GENERATE_UI_TOKEN: 'true'

jobs:
  test:
    name: 'Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [20, 22, 24]
        include:
          - os: macos-latest
            node_version: 24
          - os: windows-latest
            node_version: 24
      fail-fast: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: ./.github/actions/setup-webdriverio
        id: setup-webdriverio
        with:
          firefox-version: false

      - name: Install
        run: pnpm i

      - uses: ./.github/actions/setup-playwright

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci ${{ inputs.test-filter }}

      - name: Test Examples
        run: pnpm run test:examples ${{ inputs.test-filter }}

      - name: Unit Test UI
        run: pnpm -C packages/ui test:ui

      - name: Pack @vitest/mocker
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node_version == 20 }}
        working-directory: packages/mocker
        env:
          UV_THREADPOOL_SIZE: 1
        run: |
          pnpm pack
          for f in vitest-mocker-*.tgz; do mv "$f" "${f#vitest-}"; done
          ls -la mocker-*.tgz

      - name: Upload @vitest/mocker tarball
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node_version == 20 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-mocker-tgz
          path: packages/mocker/mocker-*.tgz
          if-no-files-found: error

  test-cached:
    name: 'Cache&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    strategy:
      matrix:
        node_version: [24]
        os:
          - macos-latest
          - windows-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: ./.github/actions/setup-webdriverio
        id: setup-webdriverio
        with:
          firefox-version: false

      - name: Install
        run: pnpm i

      - uses: ./.github/actions/setup-playwright

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci:cache ${{ inputs.test-filter }}

  test-browser:
    name: 'Browsers: node-${{ matrix.node_version }}, ${{ matrix.os }}'

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: [24]
        os:
          - macos-latest
          - windows-latest
      fail-fast: false

    timeout-minutes: 50

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: ./.github/actions/setup-webdriverio
        id: setup-webdriverio

      - name: Install
        run: pnpm i

      - uses: ./.github/actions/setup-playwright

      - name: Build
        run: pnpm run build

      - name: Test Browser (playwright)
        run: pnpm run test:browser:playwright ${{ inputs.test-filter }}

      - name: Test Browser (webdriverio)
        run: pnpm run test:browser:webdriverio ${{ inputs.test-filter }}

  # test-rolldown removed for the sealed build: it rewrites pnpm-workspace.yaml
  # to override vite with `npm:vite@8` and re-resolves dependencies with
  # `pnpm i --no-frozen-lockfile` -- a forward-compat probe against whatever
  # vite@8 resolves to today, which cannot be reproduced at release time.
  # Every suite it runs (test:ci, test:examples, test:browser:playwright) also
  # runs against the pinned vite in the test / test-cached / test-browser jobs.
